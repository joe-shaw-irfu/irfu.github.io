<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSIICS-15 Smart Search</title>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Instrument+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f3ef;--surface:#fff;--surface2:#f0ede8;
  --ink:#1a1815;--ink2:#5c5650;--ink3:#9e9890;
  --accent:#1d5c8a;--accent-light:rgba(29,92,138,.1);
  --border:#ddd9d3;--border-strong:#bfb9b2;
  --radius:6px;--radius-lg:12px;
}
body{font-family:'Instrument Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.5}

/* ── Header ── */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;z-index:100}
.logo{font-family:'DM Serif Display',serif;font-size:19px;color:var(--ink);display:flex;align-items:center;gap:8px}
.logo-sub{font-family:'Instrument Sans',sans-serif;font-size:12px;font-weight:400;color:var(--ink3);border-left:1px solid var(--border);padding-left:10px;margin-left:4px}
.header-count{font-size:12px;color:var(--ink3);font-family:'DM Mono',monospace}

/* ── Page layout ── */
.layout{max-width:1320px;margin:0 auto;padding:1.5rem;display:grid;grid-template-columns:620px 1fr;gap:1.5rem;align-items:start}

/* ── Sidebar ── */
.sidebar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;position:sticky;top:70px;max-height:calc(100vh - 90px);display:flex;flex-direction:column}

.sidebar-head{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.sidebar-head-label{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.sidebar-head-actions{display:flex;align-items:center;gap:8px}

.btn-clear{font-size:11px;color:var(--accent);background:none;border:none;cursor:pointer;font-family:inherit;display:none;padding:0}
.btn-clear:hover{text-decoration:underline}
.btn-reset{font-size:11px;color:var(--ink3);background:none;border:1px solid var(--border);border-radius:4px;cursor:pointer;font-family:inherit;padding:3px 9px;display:flex;align-items:center;gap:5px;transition:color .15s,border-color .15s}
.btn-reset:hover{color:var(--ink2);border-color:var(--border-strong)}

/* ── Three-column inner layout ── */
.sidebar-body{display:grid;grid-template-columns:160px 1fr 1fr;flex:1;overflow:hidden;min-height:0}

/* Column shared */
.col{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border)}
.col:last-child{border-right:none}
.col-head{padding:7px 10px 6px;font-size:10px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface)}

/* ── Body chart column ── */
.col-chart{display:flex;flex-direction:column;overflow:hidden}
.chart-scroll{overflow-y:auto;flex:1;padding:10px 8px}
.chart-inner{display:flex;flex-direction:column;align-items:center}

#body-svg{width:106px;height:auto;display:block;cursor:default}
#body-svg .region{cursor:pointer}
#body-svg .body-base{fill:#e8e2da;stroke:#c8c0b6;stroke-width:.8}
#body-svg .region-fill{fill:#1d5c8a;opacity:0;transition:opacity .12s}
#body-svg .region:hover .region-fill{opacity:.28}
#body-svg .region-fill.active{opacity:.55}
#body-svg .region:hover .region-fill.active{opacity:.75}
#chart-hint{font-size:10px;color:var(--ink3);margin-top:6px;text-align:center;min-height:14px;line-height:1.3;padding:0 4px}

/* expandable body-part list */
.bp-toggle{width:100%;background:none;border:none;border-top:1px solid var(--border);padding:7px 10px;font-family:'Instrument Sans',sans-serif;font-size:10px;font-weight:500;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;cursor:pointer;flex-shrink:0}
.bp-toggle:hover{background:var(--surface2);color:var(--ink2)}
.bp-toggle .chev{transition:transform .18s}
.bp-toggle.open .chev{transform:rotate(180deg)}
.bp-list{max-height:0;overflow:hidden;transition:max-height .22s ease;border-top:none}
.bp-list.open{max-height:260px;overflow-y:auto;border-top:1px solid var(--border)}
.bp-opt{display:flex;align-items:center;gap:6px;padding:3px 10px;cursor:pointer;font-size:12px;color:var(--ink2);user-select:none}
.bp-opt:hover{background:var(--surface2)}

/* ── Scrollable filter columns ── */
.col-scroll{overflow-y:auto;flex:1;padding:5px 0}

/* ── Shared checkbox style ── */
.fopt{display:flex;align-items:center;gap:7px;padding:5px 10px;cursor:pointer;font-size:12.5px;color:var(--ink2);user-select:none;transition:background .1s}
.fopt:hover{background:var(--surface2);color:var(--ink)}
.fopt.dimmed{display:none}
.fopt-name{flex:1;line-height:1.3}
.fopt input[type=checkbox],.bp-opt input[type=checkbox]{width:13px;height:13px;border:1.5px solid var(--border-strong);border-radius:3px;appearance:none;-webkit-appearance:none;cursor:pointer;flex-shrink:0;position:relative;background:white;transition:background .12s,border-color .12s}
.fopt input[type=checkbox]:checked,.bp-opt input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.fopt input[type=checkbox]:checked::after,.bp-opt input[type=checkbox]:checked::after{content:'';position:absolute;left:2px;top:1px;width:5px;height:7px;border:1.5px solid white;border-top:none;border-left:none;transform:rotate(45deg)}

/* ── Main content ── */
.content{display:flex;flex-direction:column;gap:1rem}
.search-wrap{position:relative}
.search-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none}
#search-input{width:100%;height:48px;padding:0 16px 0 44px;font-family:'Instrument Sans',sans-serif;font-size:15px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
#search-input::placeholder{color:var(--ink3)}
#search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.search-hint{font-size:12px;color:var(--ink3);padding:0 2px}
.results-meta{font-size:13px;color:var(--ink3);padding:0 2px}
.results-meta .hl{color:var(--ink2);font-weight:500}
.results-list{display:flex;flex-direction:column;gap:7px}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 16px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;cursor:pointer;position:relative;transition:border-color .15s}
.result-card:hover{border-color:var(--border-strong)}
.card-diag{font-family:'DM Serif Display',serif;font-size:15.5px;color:var(--ink);line-height:1.35;flex:1;pointer-events:none}
.card-diag mark{background:rgba(29,92,138,.13);color:#1a4a6e;border-radius:2px;padding:0 1px}
.card-code{font-family:'DM Mono',monospace;font-size:11.5px;color:var(--ink3);white-space:nowrap;background:var(--surface2);border-radius:4px;padding:3px 7px;flex-shrink:0;pointer-events:none;transition:background .15s,color .15s}
.result-card:hover .card-code{background:var(--accent);color:#fff}
.result-card.copied .card-code{background:#1a7a4a;color:#fff;visibility:hidden}
.copy-tick{display:none;position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:11px;color:#1a7a4a;font-family:'Instrument Sans',sans-serif;font-weight:500}
.result-card.copied .copy-tick{display:block}
.empty-state{text-align:center;padding:4rem 2rem;color:var(--ink3)}
.empty-state p{font-size:14px;margin-top:1rem}
.load-more{display:none;margin:0 auto;font-family:'Instrument Sans',sans-serif;font-size:13px;font-weight:500;color:var(--ink2);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px 24px;cursor:pointer;transition:border-color .15s}
.load-more:hover{border-color:var(--border-strong)}

@media(max-width:960px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:static;max-height:none}
  .sidebar-body{grid-template-columns:1fr}
  .col{border-right:none;border-bottom:1px solid var(--border)}
  .col:last-child{border-bottom:none}
}
</style>
</head>

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function highlight(text, matches) {
  if (!text) return '';
  if (!matches) return esc(text);
  const rel = matches.filter(m => m.key === 'd');
  if (!rel.length) return esc(text);
  const indices = rel.flatMap(m => m.indices).sort((a,b) => a[0]-b[0]);
  let out = '', last = 0;
  indices.forEach(([s,e]) => {
    out += esc(text.slice(last,s));
    out += '<mark>' + esc(text.slice(s,e+1)) + '</mark>';
    last = e+1;
  });
  return out + esc(text.slice(last));
}

function getFiltered() {
  return DB.filter(r => {
    if (active.b.size && !active.b.has(r.b)) return false;
    if (active.t.size && !active.t.has(r.t)) return false;
    if (active.p.size && !active.p.has(r.p)) return false;
    return true;
  });
}

/* ── Build body-part expandable list ── */
function buildBodyPartList() {
  const container = document.getElementById('bp-list');
  const parts = [...new Set(DB.map(r => r.b).filter(Boolean))].sort();
  container.innerHTML = '';
  parts.forEach(val => {
    const label = document.createElement('label');
    label.className = 'bp-opt';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.dataset.val = val;
    cb.checked = active.b.has(val);
    cb.addEventListener('change', () => {
      if (cb.checked) active.b.add(val); else active.b.delete(val);
      syncChartHighlights();
      updateClearBtn(); page = 1; render();
      document.getElementById('chart-hint').textContent = [...active.b].join(', ') || '';
    });
    const span = document.createElement('span');
    span.textContent = val;
    label.appendChild(cb); label.appendChild(span);
    container.appendChild(label);
  });
}

    cb.type = 'checkbox';
    cb.dataset.val = val;
    cb.checked = active.p.has(val);
    cb.addEventListener('change', () => {
      if (cb.checked) active.p.add(val); else active.p.delete(val);
      updateClearBtn(); page = 1; render();
    });
    const span = document.createElement('span');
    span.className = 'fopt-name'; span.textContent = val;
    label.appendChild(cb); label.appendChild(span);
    container.appendChild(label);
  });
  updatePathologyDimming();
}

/* ── Dim pathology options not relevant to selected tissues ── */
function updatePathologyDimming() {
  const selTissues = [...active.t];
  let relevant;
  if (selTissues.length === 0) {
    relevant = null; // all relevant
  } else {
    relevant = new Set();
    selTissues.forEach(t => { if (TISSUE_PATHS[t]) TISSUE_PATHS[t].forEach(p => relevant.add(p)); });
  }
  document.querySelectorAll('#pathology-col .fopt').forEach(label => {
    const val = label.dataset.path;
    const irrelevant = relevant !== null && !relevant.has(val);
    label.classList.toggle('dimmed', irrelevant);
    if (irrelevant) {
      const cb = label.querySelector('input');
      if (cb.checked) { cb.checked = false; active.p.delete(val); }
    }
  });
}

/* ── Body-chart click (multi-select) ── */
const hint = document.getElementById('chart-hint');
document.querySelectorAll('#body-svg .region').forEach(g => {
  const parts = g.dataset.parts.split(',').map(s => s.trim());
  const lbl = g.dataset.label;
  g.addEventListener('mouseenter', () => hint.textContent = lbl);
  g.addEventListener('mouseleave', () => hint.textContent = [...active.b].join(', ') || '');
  g.addEventListener('click', () => {
    const allActive = parts.every(p => active.b.has(p));
    if (allActive) parts.forEach(p => active.b.delete(p));
    else parts.forEach(p => active.b.add(p));
    syncBodyPartCheckboxes();
    syncChartHighlights();
    updateClearBtn(); page = 1; render();
    hint.textContent = [...active.b].join(', ') || '';
  });
});

function syncChartHighlights() {
  document.querySelectorAll('#body-svg .region').forEach(g => {
    const parts = g.dataset.parts.split(',').map(s => s.trim());
    g.querySelector('.region-fill').classList.toggle('active', parts.some(p => active.b.has(p)));
  });
}

function syncBodyPartCheckboxes() {
  document.querySelectorAll('#bp-list input[type=checkbox]').forEach(cb => {
    cb.checked = active.b.has(cb.dataset.val);
  });
}

/* ── Expandable body-part list toggle ── */
document.getElementById('bp-toggle').addEventListener('click', function() {
  const list = document.getElementById('bp-list');
  const open = list.classList.toggle('open');
  this.classList.toggle('open', open);
});

/* ── Clear / Reset ── */
function clearAllFilters() {
  active.b.clear(); active.t.clear(); active.p.clear();
  document.querySelectorAll('#bp-list input[type=checkbox]').forEach(cb => cb.checked = false);
  document.querySelectorAll('#tissue-col input[type=checkbox]').forEach(cb => cb.checked = false);
  document.querySelectorAll('#pathology-col input[type=checkbox]').forEach(cb => cb.checked = false);
  syncChartHighlights();
  updatePathologyDimming();
  updateClearBtn();
  hint.textContent = '';
  page = 1;
}

function updateClearBtn() {
  const any = active.b.size > 0 || active.t.size > 0 || active.p.size > 0;
  document.getElementById('btn-clear').style.display = any ? 'block' : 'none';
}

document.getElementById('btn-clear').addEventListener('click', () => { clearAllFilters(); render(); });
document.getElementById('btn-reset').addEventListener('click', () => {
  document.getElementById('search-input').value = '';
  clearAllFilters(); render();
});

/* ── Copy code on card click ── */
function copyCode(card, code) {
  navigator.clipboard.writeText(code).then(() => {
    card.classList.add('copied');
    setTimeout(() => card.classList.remove('copied'), 1400);
  });
}

/* ── Render results ── */
function render() {
  const query = document.getElementById('search-input').value.trim();
  const filtered = getFiltered();
  let results;
  if (!query) {
    results = filtered.map(item => ({ item, matches: null }));
  } else {
    const localFuse = new Fuse(filtered, fuseOpts);
    results = localFuse.search(query);
  }
  const total = results.length;
  const showing = Math.min(page * PAGE_SIZE, total);

  document.getElementById('header-count').textContent =
    total.toLocaleString() + ' / ' + DB.length.toLocaleString() + ' diagnoses';

  const qHtml = query ? ' for "<span class=\"hl\">' + esc(query) + '</span>"' : '';
  document.getElementById('results-meta').innerHTML =
    '<span class="hl">' + total.toLocaleString() + '</span> result' + (total !== 1 ? 's' : '') + qHtml;

  const grid = document.getElementById('results');
  const moreBtn = document.getElementById('load-more-btn');

  if (!total) {
    grid.innerHTML = '<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p>No diagnoses found. Try different search terms or clear some filters.</p></div>';
    moreBtn.style.display = 'none';
    return;
  }

  grid.innerHTML = results.slice(0, showing).map(({ item, matches }) =>
    '<div class="result-card" data-code="' + esc(item.c) + '" title="Click to copy code">' +
    '<span class="card-diag">' + highlight(item.d, matches) + '</span>' +
    '<span class="card-code">' + esc(item.c) + '</span>' +
    '<span class="copy-tick">Copied</span>' +
    '</div>'
  ).join('');

  grid.querySelectorAll('.result-card').forEach(card => {
    card.addEventListener('click', () => copyCode(card, card.dataset.code));
  });

  if (showing < total) {
    moreBtn.style.display = 'block';
    moreBtn.textContent = 'Load more (' + (total - showing).toLocaleString() + ' remaining)';
  } else {
    moreBtn.style.display = 'none';
  }
}

document.getElementById('search-input').addEventListener('input', () => { page = 1; render(); });
document.getElementById('load-more-btn').addEventListener('click', () => { page++; render(); });

buildBodyPartList();
buildTissueFilter();
buildPathologyFilter();
render();
</script>
</body>
</html>
